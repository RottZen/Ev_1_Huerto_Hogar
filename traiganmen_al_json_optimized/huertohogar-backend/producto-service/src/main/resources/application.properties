spring.application.name=producto-service
server.port=8080

# --- Base de datos (MySQL local o AWS RDS). Se configura por variables de entorno ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/huertohogar_productos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mensajes de error utiles para el frontend
server.error.include-message=always
server.error.include-binding-errors=always

# Origen permitido (Vite corre en 5173)
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
