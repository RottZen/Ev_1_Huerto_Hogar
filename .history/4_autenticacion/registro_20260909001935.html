<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación - HuertoHogar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../7_comunes/global.css">
    <link rel="stylesheet" href="registro.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- MENU DE NAVEGACION -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="../1_inicio/index.html">
                    <img src="../assets/img/logo.png" alt="Logo HuertoHogar" class="logo-header d-inline-block align-text-center">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuNavegacion">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="../1_inicio/index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="../2_catalogo/catalogo.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="../6_seguimiento/rastreo.html">Seguimiento</a></li>
                    </ul>
                    <div class="d-flex gap-2">
                        <a href="registro.html" class="btn btn-outline-success active">Mi Cuenta</a>
                        <a href="../3_carrito/carrito.html" class="btn btn-warning">
                            Carrito <span class="badge bg-dark ms-1 " id="contador-carrito">0</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- MAIN CONTENEDOR DINAMICO -->
    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 card-auth">
                    <div class="card-body p-4">
                        <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab" aria-controls="pills-login" aria-selected="true">Iniciar Sesión</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="pills-registro-tab" data-bs-toggle="pill" data-bs-target="#pills-registro" type="button" role="tab" aria-controls="pills-registro" aria-selected="false">Registrarse</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="pills-tabContent">
                            
                            <div class="tab-pane fade show active" id="pills-login" role="tabpanel" aria-labelledby="pills-login-tab">
                                <h3 class="text-center mb-3">¡Bienvenido de vuelta!</h3>
                                <form id="form-login">
                                    <div class="mb-3">
                                        <label for="login-email" class="form-label">Correo Electrónico</label>
                                        <input type="email" class="form-control" id="login-email" placeholder="ejemplo@correo.cl" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="login-password" class="form-label">Contraseña</label>
                                        <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" id="recordarme">
                                            <label class="form-check-label small" for="recordarme">Recordarme</label>
                                        </div>
                                        <a href="#" class="small text-decoration-none text-muted">¿Olvidaste tu contraseña?</a>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Ingresar</button>
                                </form>
                            </div>

                            <!-- FORMULARIO DE REGISTRO -->
                            <div class="tab-pane fade" id="pills-registro" role="tabpanel" aria-labelledby="pills-registro-tab">
                                <h3 class="text-center mb-3">Crea tu cuenta</h3>
                                <form id="form-registro">
                                    <div class="mb-3">
                                        <label for="registro-nombre" class="form-label">Nombre Completo</label>
                                        <input type="text" class="form-control" id="registro-nombre" placeholder="Juan Pérez" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="registro-email" class="form-label">Correo Electrónico</label>
                                        <input type="email" class="form-control" id="registro-email" placeholder="ejemplo@correo.cl" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="registro-telefono" class="form-label">Teléfono de Contacto</label>
                                        <div class="input-group">
                                            <span class="input-group-text">+56</span>
                                            <input type="tel" class="form-control" id="registro-telefono" placeholder="912345678" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="registro-password" class="form-label">Contraseña Segura</label>
                                        <input type="password" class="form-control" id="registro-password" placeholder="Mínimo 8 caracteres" required>
                                    </div>
                                    <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold">Registrarme en HuertoHogar</button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p>&copy; 2026 HuertoHogar - PROYECTO DSY 1104. Todos los derechos reservados.</p>
            <p>Desarrollado por el equipo TRAIGANMEN AL JSON.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../7_comunes/datos.js"></script>
    <script src="registro.js"></script>
</body>
</html>
