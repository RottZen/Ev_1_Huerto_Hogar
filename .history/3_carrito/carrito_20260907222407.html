<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - HuertoHogar</title>

    <!-- Bootstrap y Fuentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- CSS del Proyecto -->
    <link rel="stylesheet" href="../7_comunes/global.css">
    <link rel="stylesheet" href="carrito.css">

</head>
<body>

    <!--HEADER --> 

    <HEAder>
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand font-playfair text-marron" href="../1_inicio/index.html">HuertoHogar</a>
            </div>
        </nav>
    </HEAder>


    <main class = "container my-5">
        <h2 class="mb-4 text-center">Tu Carrito de Compras</h2>
        <div class="row">
            <!-- Columna izquierda: Lista de productos en el carrito -->
             <div class="col-lg-8 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th>Productos</th>
                                        <th>Precio</th>
                                        <th>Cantidad</th>
                                        <th>Total</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <!-- contenedor dinamico para JS -->
                                 <tbody id="tabla-carrito">
                                    <tr>
                                        <td colspan="5" class="text-center">El carrito está vacío.</td>
                                    </tr>
                                 </tbody>
                            </table>
                        </div>
                    </div>
                </div>
             </div>
        
        <!-- columna derecha: Resumen del pedido y confirmacion pedido--> 
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <h4 class = "card-title mb-4"> Resumen del pedido</h4>

                <div class="d-flex justify-content-between mb-3 text-secondary">
                    <span>Subtotal:</span>
                    <span id="subtotal-carrito">$0 CLP </span>
                </div>
                
                <hr>
                <div class="d-flex justify-content-between mb-4">
                    <strong>Total a pagar:</strong>
                    <strong id="total-carrito"  class="fs-4 text-dark">$0 CLP</strong>
                </div>
                <!-- boton procesar compra -->
                <button class="btn btn-primary w-100 btn-lg" id="btn-confirmar">Confirmar pedido</button>
            </div>
        </div>
        </div>



    </main>
    <script src="../7_comunes/datos.js"></script>
    <script src="carrito.js"></script>
</body>
</html>
