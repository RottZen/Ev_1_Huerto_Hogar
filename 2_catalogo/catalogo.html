<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - HuertoHogar</title>

    <!-- Bootstrap y Fuentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- CSS del Proyecto -->
    <link rel="stylesheet" href="/7_comunes/global.css">
    <link rel="stylesheet" href="catalogo.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand font-playfair text-marron" href="../1_inicio/index.html">HuertoHogar</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="../1_inicio/index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="../2_catalogo/catalogo.html">Catálogo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../3_carrito/carrito.html">
                                Carrito <span class="badge bg-success contador-carrito">0</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../4_autenticacion/registro.html">Registro / Mi Perfil</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="text-center mb-5">
            <h2 class="font-playfair">Nuestro Catálogo</h2>
            <p class="text-secondary">Productos frescos, directo desde el campo hasta tu mesa.</p>
        </div>

        <!-- Controles: búsqueda + filtros por categoría -->
        <div class="row mb-4 g-3 align-items-center">
            <div class="col-md-5">
                <input
                    type="text"
                    id="buscador-productos"
                    class="form-control"
                    placeholder="Buscar producto... (ej: manzanas)"
                    oninput="buscarProductos(this.value)">
            </div>

            <div class="col-md-7 text-md-end">
                <div class="btn-group flex-wrap" role="group">
                    <button class="btn btn-outline-success active" onclick="filtrarPorCategoria('todos')">
                        Todos
                    </button>
                    <button class="btn btn-outline-success" onclick="filtrarPorCategoria('frutas')">
                        Frutas Frescas
                    </button>
                    <button class="btn btn-outline-success" onclick="filtrarPorCategoria('verduras')">
                        Verduras Orgánicas
                    </button>
                    <button class="btn btn-outline-success" onclick="filtrarPorCategoria('organicos')">
                        Productos Orgánicos
                    </button>
                    <button class="btn btn-outline-success" onclick="filtrarPorCategoria('lacteos')">
                        Productos Lácteos
                    </button>
                </div>
            </div>
        </div>

        <!-- Acá datos.js inyecta una columna .col con tarjeta Bootstrap por cada producto -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4 grid-productos">
        </div>
    </main>

    <footer class="text-center text-secondary py-4">
        <p class="mb-0">&copy; 2026 HuertoHogar. Todos los derechos reservados.</p>
    </footer>

    <script src="/7_comunes/datos.js"></script>
    <script src="catalogo.js"></script>
</body>
</html>
