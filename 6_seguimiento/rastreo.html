    <meta charset="UTF-8">

</head>
<body class="d-flex flex-column min-vh-100">
    
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="../1_inicio/index.html">
                    <img src="../assets/img/logo.png" alt="Logo HuertoHogar" class="logo-header d-inline-block align-text-center">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuNavegacion">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="../1_inicio/index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="../2_catalogo/catalogo.html">Catalogo</a></li>
                        <li class="nav-item"><a class="nav-link active" href="rastreo.html">Seguimiento</a></li>
                    </ul>
                    <div class="d-flex gap-2">
                        <a href="../4_autenticacion/registro.html" class="btn btn-outline-success">Mi Cuenta</a>
                        <a href="../3_carrito/carrito.html" class="btn btn-warning">
                            Carrito <span class="badge bg-dark ms-1" id="contador-carrito">0</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1">
        <h2 class="text-center mb-4">Seguimiento de Pedido</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <div class="mb-3">
                        <label for="nroPedido" class="form-label">Ingrese su número de pedido</label>
                        <input type="text" class="form-control" id="nroPedido" placeholder="Ej: HH-12345">
                    </div>
                    <button class="btn btn-success w-100" onclick="buscarPedido()">Consultar Estado</button>
                </div>
                <div id="resultado-busqueda" class="mt-4 p-3 border rounded d-none">
                    <h5>Estado: <span id="estado-pedido"></span></h5>
                    <p id="detalle-pedido"></p>
                </div>

                <!-- Resultado -->
                <div id="resultado-busqueda" class="mt-4 p-3 border rounded d-none">
                    <h5>Estado: <span id="estado-pedido" class="text-success"></span></h5>
                    <p id="detalle-pedido"></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p>&copy; 2026 HuertoHogar - PROYECTO DSY 1104.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../7_comunes/datos.js"></script>
    <script>
        function buscarPedido() {
            const input = document.getElementById('nroPedido').value;
            const resDiv = document.getElementById('resultado-busqueda');
            const estado = document.getElementById('estado-pedido');
            const detalle = document.getElementById('detalle-pedido');

            if(input.trim() === "") {
                alert("Por favor ingrese un número de pedido");
                return;
            }

            // Simulamos una búsqueda
            resDiv.classList.remove('d-none');
            estado.textContent = "En Camino";
            detalle.textContent = "Su pedido HH-12345 ha salido de nuestra bodega central y llegará a su domicilio en 24-48 horas.";
        }
    </script>
</body>
